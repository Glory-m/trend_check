# 수집·분석 규칙 — 숫자와 키워드만. AI 판단 없음.

bootstrap:
  # 첫 실행(데이터 없음) 때 과거 이력을 '새 항목'으로 쏟아내지 않도록, 이 기간 안에 발표된 것만 항목으로 만든다.
  recent_days: 7

claude_code:
  # npm에는 있는데 CHANGELOG에 없는 버전을 '기록 누락'으로 볼 때까지 기다리는 시간 (CHANGELOG 반영 지연 고려)
  unlisted_grace_hours: 48

watchlist:
  # 처음 스냅샷하는 레포의 최신 release를 항목으로 만들 기준 (발표 후 N일 이내만)
  first_release_days: 3

discovery:
  topics:
    - claude-code
    - claude-skills
    - claude-code-skills
    - claude-code-plugin
    - agent-skills
    - mcp-server
  keywords:            # in:name,description 검색
    - claude code
  # 쿼리당 결과 상한(1000개)을 넘지 않도록 topic × 조건으로 쪼갠다. 별 순 상위만 사용.
  conditions:
    - name: new        # 최근 생성된 신예
      q: "created:>={days_ago:30} stars:>=20"
    - name: active     # 최근 활동 중인 인기 레포
      q: "pushed:>={days_ago:7} stars:>=200"
  per_page: 100
  max_pages: 2         # 비인증(로컬)일 때는 1로 줄인다
  new_candidate_days: 30   # bootstrap 때는 이 기간 안에 생성된 레포만 '신규 발견' 항목으로

candidates:
  max_tracked: 150
  drop_after_days: 14  # 이 기간 동안 검색·트렌딩에 안 잡히면 후보에서 자동 제외
  max_new_items_per_day: 10  # '신규 발견' 항목은 별 속도 상위 N개만 (나머지는 조용히 추적)
  # 순위: 오늘 트렌딩 우선, 그다음 별 속도(별 수 / 나이(일, 최소 7))

hn:
  # 쿼리별 최소 점수 — 사용법·노하우 글은 점수가 낮아도 가치가 있어 기준을 낮춘다
  queries:
    - {q: claude code, min_points: 30}
    - {q: claude skills, min_points: 20}
    - {q: mcp server, min_points: 30}
    - {q: agent skills, min_points: 20}
    - {q: CLAUDE.md, min_points: 10}
    - {q: claude code workflow, min_points: 10}
    - {q: anthropic, min_points: 100}
  lookback_days: 3

official:
  # 공식 소스 첫 실행 때 이 기간 안에 발표된 글만 항목으로 (이후에는 새 글 전부)
  bootstrap_days: 14

trending:
  periods: [daily, weekly]

# 트렌딩·HN 결과가 이 프로젝트와 관련 있는지 판단하는 키워드 (소문자 부분일치)
relevance_keywords:
  - claude
  - anthropic
  - mcp
  - model context protocol
  - skill
  - coding agent
  - agentic
  - subagent
  - vibe cod
  - codex
  - cursor
  - copilot
  - ai coding
