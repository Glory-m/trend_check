# 수집·분석 규칙 — 숫자와 키워드만. AI 판단 없음.

bootstrap:
  # 첫 실행(데이터 없음) 때 과거 이력을 '새 항목'으로 쏟아내지 않도록, 이 기간 안에 발표된 것만 항목으로 만든다.
  recent_days: 7

claude_code:
  # npm에는 있는데 CHANGELOG에 없는 버전을 '기록 누락'으로 볼 때까지 기다리는 시간 (CHANGELOG 반영 지연 고려)
  unlisted_grace_hours: 48

watchlist:
  # 처음 스냅샷하는 레포의 최신 release를 항목으로 만들 기준 (발표 후 N일 이내만)
  first_release_days: 3

discovery:
  topics:
    - claude-code
    - claude-skills
    - claude-code-skills
    - claude-code-plugin
    - agent-skills
    - mcp-server
  keywords:            # in:name,description 검색
    - claude code
  # 쿼리당 결과 상한(1000개)을 넘지 않도록 topic × 조건으로 쪼갠다. 별 순 상위만 사용.
  conditions:
    - name: new        # 최근 생성된 신예
      q: "created:>={days_ago:30} stars:>=20"
    - name: active     # 최근 활동 중인 인기 레포
      q: "pushed:>={days_ago:7} stars:>=200"
  per_page: 100
  max_pages: 2         # 비인증(로컬)일 때는 1로 줄인다
  new_candidate_days: 30   # bootstrap 때는 이 기간 안에 생성된 레포만 '신규 발견' 항목으로

candidates:
  max_tracked: 150
  drop_after_days: 14  # 이 기간 동안 검색·트렌딩에 안 잡히면 후보에서 자동 제외
  max_new_items_per_day: 10  # '신규 발견' 항목은 별 속도 상위 N개만 (나머지는 조용히 추적)
  # 순위: 오늘 트렌딩 우선, 그다음 별 속도(별 수 / 나이(일, 최소 7))

hn:
  # 쿼리별 최소 점수 — 사용법·노하우 글은 점수가 낮아도 가치가 있어 기준을 낮춘다
  queries:
    - {q: claude code, min_points: 30}
    - {q: claude skills, min_points: 20}
    - {q: mcp server, min_points: 30}
    - {q: agent skills, min_points: 20}
    - {q: CLAUDE.md, min_points: 10}
    - {q: claude code workflow, min_points: 10}
    - {q: anthropic, min_points: 100}
  lookback_days: 3

official:
  # 공식 소스 첫 실행 때 이 기간 안에 발표된 글만 항목으로 (이후에는 새 글 전부)
  bootstrap_days: 14

trending:
  periods: [daily, weekly]

# 트렌딩·HN 결과가 이 프로젝트와 관련 있는지 판단하는 키워드 (소문자 부분일치)
relevance_keywords:
  - claude
  - anthropic
  - mcp
  - model context protocol
  - skill
  - coding agent
  - agentic
  - subagent
  - vibe cod
  - codex
  - cursor
  - copilot
  - ai coding

# ---- 분석 (collector/analyze.py) ----
stars:
  surge:                 # 급등: 절대값 또는 비율 (작은 레포의 급성장도 잡히게)
    d1_abs: 200
    d1_pct: 10           # %, 단 d1_min_abs 이상일 때만
    d1_min_abs: 30
    d7_abs: 500
    d7_pct: 20
    d7_min_abs: 50
    min_stars: 100       # 비율 판정은 이 별 수 이상 레포만
  suspicious:            # '참고 경고'만 — 바이럴과 구분이 어렵다
    star_fork_ratio: 60          # 별/포크 비율이 이보다 크고
    star_fork_min_stars: 1000    # 별이 이 이상
    young_days: 14               # 생성 N일 이내에
    young_stars: 2000            # 별이 이 이상이고 포크 비율 1% 미만
    step_share: 0.8              # 7일 증가분의 80% 이상이 하루에 몰림
    step_min_abs: 300
  promote:               # 후보 → 핵심 watchlist 승격 '제안'
    d7_abs: 300
    d7_pct: 30
    min_stars: 100
    pushed_within_days: 30
  demote:                # 핵심 → 강등 '제안'
    no_push_days: 90
    d30_pct_below: 0.5
  series_days: 90        # 사이트 차트용 이력 길이
  series_top_candidates: 20

# ---- 분류 (collector/classify.py) — 규칙 기반 1차 판정, AI 판단은 digest에 따로 ----
classify:
  reclassify_days: 14    # 규칙이 바뀌면 최근 N일 항목도 다시 판정 (결과가 같으면 파일 변화 없음)
  # 키워드 매칭: 단어 단위(복수·과거형 허용, launch→launched), 끝이 * 이면 접두어 (deprecat* → deprecated)
  category_keywords:     # 우선순위: 보안 → 스킬·플러그인·MCP → 신기술 → 사용법·워크플로 → 기타
    보안: [security, vulnerab*, cve-, exploit, prompt injection, sandbox escape, credential leak, secret leak,
          malicious, malware, supply chain, xss, csrf, rce, privilege escalation, permission bypass, 보안, 취약]
    스킬·플러그인·MCP: [skill, plugin, mcp, marketplace, connector, extension]
    신기술: [new model, launch, introducing, now available, research preview, beta, protocol, sdk, managed agents,
           claude opus, claude sonnet, claude haiku, claude fable, api]
    사용법·워크플로: [claude.md, workflow, hook, subagent, best practice, settings, config, slash command, plan mode,
               memory, context, guide, how we, how to, tips, code review, permission]
  high_signals:          # 중요도 높음 신호
    # 실제 보안 이슈 (단순히 'security'가 언급된 것은 분류만 보안, 중요도는 보통)
    security_issue: [vulnerab*, cve-, exploit, prompt injection, malicious, malware, supply chain, rce, xss, csrf,
                     privilege escalation, permission bypass, credential leak, secret leak, sandbox escape, 취약]
    # 기존 사용법을 바꾸는 변경 — Changed/Removed/Deprecated 항목과 공식 노트에만 적용 (Improved·Fixed 제외)
    breaking: [breaking, deprecat*, no longer, now requires, can break, migrat*, removed, default is now, now defaults]
    model_launch: [launched claude, launch, new model, introducing claude]
  low_types: [npm_unlisted]

# ---- SKILL.md 위험 신호 감사 (collector/audit.py) — Actions에서만, 원문 저장 안 함 ----
audit:
  top_candidates: 30          # 핵심 watchlist + 별 속도 상위 후보 N개
  refresh_days: 7             # 감사 후 N일이 지났거나 새 push가 있으면 다시
  max_files_per_repo: 40
  max_raw_fetches_per_run: 400

# ---- 무료 기계 번역 (collector/translate.py) — 기본: 오픈소스 Argos(키 불필요), Azure 키가 있으면 Azure ----
translate:
  days: 3                 # 최근 N일(KST) 항목 중 한국어 문장이 없는 '높음·보통'
  max_items_per_run: 80
  max_chars_per_run: 20000   # 하루 약 2만 자 → 월 60만 자 (Azure 무료 200만 자 안)
  argos:
    sha256: ""               # 모델 zip 해시 — 첫 실행 health.json(steps.translate)에 찍힌 값을 여기에 고정
