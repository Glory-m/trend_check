# 매일 수집 — AI·API 키 사용 없음. GitHub이 자동 발급하는 GITHUB_TOKEN만 사용.
# 보안: 외부 PR로는 실행되지 않음(schedule·수동 실행만), 액션은 커밋 해시로 고정, data/ 외에는 커밋하지 않음.
name: collect

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST (= 21:17 UTC, 정각 혼잡 회피)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # data/ 커밋용
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      # 무료 기계 번역(오픈소스 Argos 영→한) — 키 불필요. 실패해도 번역만 건너뛰고 수집은 계속.
      # 모델 zip 해시는 수집기가 config/rules.yml translate.argos.sha256 과 대조한다.
      - name: Translation model (open-source, no key)
        continue-on-error: true
        run: |
          pip install --disable-pip-version-check -r requirements-mt.txt
          curl -fsSL --retry 3 --max-time 300 -o "$RUNNER_TEMP/argos-en_ko.zip" https://argos-net.com/v1/translate-en_ko-1_1.argosmodel

      - name: Collect
        id: collect
        continue-on-error: true   # 필수 단계 실패여도 health.json은 커밋하고, 마지막에 실패 처리
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 무료 기계 번역 — Azure 비밀값이 있으면 Azure, 없으면 오픈소스 Argos 모델. 둘 다 없으면 건너뜀
          TREND_MT_MODEL_ZIP: ${{ runner.temp }}/argos-en_ko.zip
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: python -m collector

      - name: Guard (secrets · hidden chars · forbidden files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          python scripts/guard.py --staged

      - name: Commit & push
        run: |
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -q -m "data: collect $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "push 실패" >&2
          exit 1

      - name: Fail if a required step failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "필수 수집 단계 실패 — data/health.json 확인" >&2
          exit 1
