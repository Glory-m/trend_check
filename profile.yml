# trend-watch 개인 프로필 — /profile 스킬로 갱신
# 추천·중요도 판정의 기준. 사실만 기록하고, 바뀌면 updated_at도 갱신한다.
updated_at: 2026-10-19

stack:
  primary:
    - name: Java / Spring Boot
      notes: Gradle, JPA, Flyway, actuator
    - name: TypeScript 웹
      notes: React / Next.js 프론트엔드, Node
  secondary: []

builds:            # 만드는 것의 종류
  - 웹서비스·SaaS
  - 개인 자동화·도구

skill_level: 중급   # 매일 사용, CLAUDE.md·스킬·MCP 일부 경험, hooks·subagent는 아직 익숙하지 않음

goals:             # 3~6개월
  - 실제 서비스 출시
  - 안정적인 개발 환경 (테스트·리뷰·배포 최소 워크플로)
  - 생산성 극대화
  - 실력 향상·학습

installed:         # 2026-10-19 ~/.claude 설정 파일 기준으로 확인
  skills:
    - find-skills
    - ui-ux-pro-max
  plugins: []      # 마켓플레이스 claude-plugins-official 등록만 됨, 활성 플러그인 없음
  plugin_marketplaces:
    - claude-plugins-official
  mcp_servers: []
  connectors:      # claude.ai 커넥터
    - Claude Docs

model:
  default: opus
  effort: high
plan: Max          # 사용량 여유 있음 — 단, 매일 쓰는 /brief·/weekly는 가볍게 유지

environment:       # 2026-10-19 이 PC 기준 — 해당 플랫폼 변경은 나에게 직접 영향
  os: Windows 11
  ide: VS Code (Claude Code 확장)
  keywords: [windows, powershell, vscode, vs code]

# 관심 분야 — keywords(소문자 부분일치)가 항목 제목·본문에 있으면 중요도 '높음' 후보 (collector/classify.py)
interests:
  - name: 워크플로·품질
    detail: 계획→구현→리뷰, TDD, 코드 리뷰, CLAUDE.md 작성법, hooks
    keywords: [workflow, tdd, code review, pr review, claude.md, hooks, pretooluse, posttooluse, userpromptsubmit, plan mode, best practice*, slash command, auto memory]
  - name: 테스트·배포 자동화
    detail: Playwright, CI/CD, GitHub Actions, DB 마이그레이션
    keywords: [playwright, browser test*, e2e, end-to-end, ci/cd, github actions, claude-code-action, unit test*, integration test*, flyway, db migration*]
  - name: 병렬·자율 에이전트
    detail: subagent, worktree, 백그라운드·클라우드 실행
    keywords: [subagent*, worktree*, background agent*, background session*, background task*, parallel agent*, agent team*, cloud session*, routine, headless, agent sdk]
  - name: UI/UX·디자인
    detail: 디자인 시스템, Figma 연동, 프론트 품질
    keywords: [ui/ux, ui design, design system*, figma, frontend, front-end, tailwind, accessibility, css]

# 내가 쓰지 않는 기능·환경 — 보안이 아니면 중요도 '낮음' (개인 Max 요금제, Windows 로컬 사용 기준)
not_using:
  - name: 조직·엔터프라이즈 관리 기능
    keywords: [enterprise, team plan*, organization, managed settings, managed policy, compliance api, admin console, sso, scim]
  - name: 클라우드 제공자 경유 사용
    keywords: [bedrock, vertex, foundry, azure, aws marketplace]
  - name: Cowork·자체 호스팅 러너
    keywords: [cowork, self-hosted runner*, self-hosted-runner, self-hosted environment*]
  - name: 플러그인 mod 제작 API
    keywords: [mod hook*, "mod's", a mod, mods]

# 내 스택 키워드 — 일치하면 '나에게 영향' 근거로 사용
stack_keywords: [spring, java, gradle, jpa, kotlin, typescript, react, next.js, nextjs, node]

not_interested:    # 키워드가 있고 관심 키워드가 없으면 중요도 '낮음'
  - name: 타 언어 생태계
    keywords: [rust, golang, .net, c#, php, elixir, ruby, swift]
  - name: 데이터과학·ML
    keywords: [data science, machine learning, jupyter, notebook, pytorch, tensorflow, kaggle]

answer_length: 간결  # /brief는 화면 한두 개, 항목당 1~2줄, '높음'만 자세히
